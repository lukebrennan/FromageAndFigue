<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Fromage &amp; Figue</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <script>
    /* A story that has just been published may not have its own page yet. Show it from the database meanwhile. */
    var m = location.pathname.match(/^\/blog\/([a-z0-9-]+)\/?$/i);
    if (m) location.replace("/post?slug=" + m[1].toLowerCase());
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f3ec; color: #141312; font: 16px/1.6 Helvetica, Arial, sans-serif; text-align: center; padding: 24px; }
    h1 { font: 400 clamp(2.4rem, 8vw, 4rem)/1.05 Georgia, serif; margin: 0 0 12px; }
    h1 em { color: #b79a5d; }
    p { margin: 0 0 24px; color: #6f6a61; }
    a { display: inline-block; padding: 14px 26px; background: #141312; color: #f7f3ec; text-decoration: none; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
    img { width: 190px; margin-bottom: 28px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo.png" alt="Fromage &amp; Figue">
    <h1>This page has <em>gone missing.</em></h1>
    <p>The page you were looking for does not exist, or has moved.</p>
    <a href="/">Back to the shop</a>
  </main>
</body>
</html>
